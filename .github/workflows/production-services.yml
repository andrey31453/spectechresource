name: Sync production services
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SYNC SERVICES ONLY
        required: true
      payload:
        description: Services JSON exported using deploy/sync-services.ts
        required: true
      photos_release:
        description: Optional release tag containing services-photos.tar.gz
        required: false
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'SYNC SERVICES ONLY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download explicitly supplied service photos
        if: inputs.photos_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.photos_release }}
        run: |
          gh release download "$RELEASE_TAG" --pattern services-photos.tar.gz --dir "$RUNNER_TEMP"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Back up and sync services only
        env:
          SSHPASS: ${{ secrets.SSH_KEY }}
          PAYLOAD: ${{ inputs.payload }}
          PHOTOS_RELEASE: ${{ inputs.photos_release }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/services.json"
          ssh-keyscan -t ed25519 -T 10 129.101.113.247 > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F 'SHA256:hJAv4KrOs02WdM9uNhrFwD5TFAdOBwvbBlEZH8VyECs'
          opts=(-o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20)
          remote=root@129.101.113.247
          if [[ -n "$PHOTOS_RELEASE" ]]; then
            mkdir "$RUNNER_TEMP/photos"
            tar -xzf "$RUNNER_TEMP/services-photos.tar.gz" -C "$RUNNER_TEMP/photos"
            while IFS= read -r -d '' file <&3; do
              relative=${file#"$RUNNER_TEMP/photos/"}
              [[ "$relative" =~ ^[0-9]{4}/[0-9]{2}/[a-f0-9-]+-full\.webp$ ]] || exit 1
              sshpass -e scp "${opts[@]}" "$file" "$remote:/opt/spectech/service-photo.tmp"
              sshpass -e ssh "${opts[@]}" "$remote" "set -e; target=/opt/spectech/shared/uploads/$relative; if test -e \"\$target\"; then cmp /opt/spectech/service-photo.tmp \"\$target\"; else install -D -o spectech -g spectech -m 640 /opt/spectech/service-photo.tmp \"\$target\"; fi; rm /opt/spectech/service-photo.tmp"
            done 3< <(find "$RUNNER_TEMP/photos" -type f -print0)
          fi
          sshpass -e scp "${opts[@]}" "$RUNNER_TEMP/services.json" "$remote:/opt/spectech/services.json"
          sshpass -e ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          trap 'rm -f /opt/spectech/services.json' EXIT
          cd /opt/spectech/current
          set -a
          source /opt/spectech/shared/app.env
          set +a
          runuser -u postgres -- pg_dump -Fc spectech > "/opt/spectech/backups/services-$(date +%s).dump"
          CONFIRM_SERVICES='SYNC SERVICES ONLY' npx tsx deploy/sync-services.ts /opt/spectech/services.json
          REMOTE