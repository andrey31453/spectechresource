name: Inspect production
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH password client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect server without changes
        env:
          SSHPASS: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSHPASS"
          ssh-keyscan -t ed25519 -T 10 129.101.113.247 > "$RUNNER_TEMP/known_hosts"
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | grep -F 'SHA256:hJAv4KrOs02WdM9uNhrFwD5TFAdOBwvbBlEZH8VyECs'
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20 root@129.101.113.247 'bash -s' <<'REMOTE'
          set -eu
          cat /etc/os-release
          free -m
          df -h /
          for cmd in docker node npm nginx psql; do command -v "$cmd" || true; done
          ss -lntp
          systemctl list-units --type=service --state=running --no-pager
          test ! -d /etc/nginx/sites-enabled || ls -l /etc/nginx/sites-enabled
          test ! -d /opt || ls -l /opt
          if command -v docker >/dev/null; then docker ps --format '{{.Names}} {{.Ports}}'; fi
          REMOTE