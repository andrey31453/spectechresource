name: Inspect production
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server without changes
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key"
          ssh-keyscan -t ed25519 -T 10 129.101.113.247 > "$RUNNER_TEMP/known_hosts"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o ConnectTimeout=20 root@129.101.113.247 'bash -s' <<'REMOTE'
          set -eu
          cat /etc/os-release
          free -m
          df -h /
          for cmd in docker node npm nginx psql; do command -v "$cmd" || true; done
          ss -lntp
          systemctl list-units --type=service --state=running --no-pager
          test ! -d /etc/nginx/sites-enabled || ls -l /etc/nginx/sites-enabled
          test ! -d /opt || ls -l /opt
          if command -v docker >/dev/null; then docker ps --format '{{.Names}} {{.Ports}}'; fi
          REMOTE